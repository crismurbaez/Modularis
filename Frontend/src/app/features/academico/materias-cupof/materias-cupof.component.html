<div class="page-container">
  <div class="header-actions">
    <div>
      <h1>Gestión Académica - Materias y CUPOF</h1>
      <p class="subtitle">Vincular asignaturas, códigos PID, orientaciones del CENS y códigos CUPOF</p>
    </div>
  </div>

  <div class="content-grid">
    <!-- Formulario de Alta -->
    <app-card padding="lg" class="form-section">
      <h3>Nueva Materia</h3>
      <form [formGroup]="materiaForm" class="form-layout">
        
        <div class="form-group">
          <app-input 
            formControlName="nombre" 
            label="Nombre de la Materia" 
            placeholder="Ej: Matemática">
          </app-input>
        </div>

        <div class="form-group row-flex">
          <div class="flex-1">
            <app-input 
              formControlName="pid" 
              label="Código PID" 
              placeholder="Ej: MAT3">
            </app-input>
          </div>
          <div class="flex-1">
            <app-input 
              formControlName="cupof" 
              label="Código CUPOF" 
              placeholder="Ej: 123456">
            </app-input>
          </div>
        </div>

        <div class="form-group">
          <label class="native-label">Orientación (Especialidad)</label>
          <select formControlName="orientacion" class="native-select">
            <option *ngFor="let ori of orientaciones" [value]="ori">{{ ori }}</option>
          </select>
        </div>

        <div class="form-footer">
          <app-button variant="primary" (onClick)="guardar()">Registrar Materia</app-button>
        </div>
      </form>
    </app-card>

    <!-- Lista de Materias Existentes -->
    <div class="list-section">
      <app-table [columns]="columns" [data]="materiasList"></app-table>
    </div>
  </div>
</div>
